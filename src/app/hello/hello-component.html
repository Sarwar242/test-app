

<div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
  <div class="text-center">
    <div class="w-20 h-20 bg-gradient-to-r from-green-500 to-blue-500 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
    </div>
    
    <h2 class="text-2xl font-semibold text-gray-900 mb-4">Hello Component</h2>
    
    <div *ngIf="receivedData; else noData" class="space-y-4">
      <h3 class="text-lg font-medium text-gray-700">Received Data:</h3>
      <div class="bg-gray-50 rounded-lg p-4 text-left">
        <p class="text-gray-600"><span class="font-medium">Message:</span> {{ receivedData?.message }}</p>
        <p class="text-gray-600"><span class="font-medium">Timestamp:</span> {{ receivedData?.timestamp | date:'medium' }}</p>
      </div>
    </div>
    
    <ng-template #noData>
      <p class="text-gray-600 mb-6">No data received. Redirecting to Test component...</p>
      <div class="w-16 h-16 border-4 border-gray-200 border-t-indigo-500 rounded-full animate-spin mx-auto"></div>
    </ng-template>
  </div>
</div>
