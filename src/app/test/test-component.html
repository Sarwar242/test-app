<div class="max-w-4xl mx-auto">
  
  <!-- Header -->
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Test Component</h1>
    <p class="text-base text-gray-600">This is a test component for navigation</p>
  </div>

  <!-- Content -->
  <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
    <div class="text-center">
      <div class="w-20 h-20 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      
      <h2 class="text-2xl font-semibold text-gray-900 mb-4">Welcome to Test Component!</h2>
      <p class="text-gray-600 mb-8">This component demonstrates routing functionality in your Angular application.</p>
      
      <!-- Send Data Button -->
      <div class="mt-8">
        <button (click)="sendDataToHello()" class="bg-gradient-to-r from-green-400 to-blue-500 text-white font-semibold py-3 px-6 rounded-lg hover:from-green-500 hover:to-blue-600 transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-lg">
          <span class="flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12l-4-4m0 0l-4 4m4-4v8"/>
            </svg>
            Send Data to Hello Component
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
